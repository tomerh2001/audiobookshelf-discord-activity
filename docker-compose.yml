services:
  app:
    image: ${ACTIVITY_IMAGE:-audiobookshelf-discord-activity:local}
    build: .
    container_name: audiobookshelf-discord-activity
    env_file: .env
    environment:
      # Writable log directory in the persistent app volume.
      LOG_DIR: /data/logs
    restart: unless-stopped
    volumes:
      - app_data:/data
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: audiobookshelf-listen-caddy
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
    networks:
      - internal

networks:
  internal:

volumes:
  app_data:
  caddy_data:
  caddy_config:
